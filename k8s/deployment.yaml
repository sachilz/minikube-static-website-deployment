
apiVersion: apps/v1
kind: Deployment

metadata:
  name: static-website
  labels:
    app: static-website

spec:
  replicas: 2

  selector:
    matchLabels:
      app: static-website

  template:
    metadata:
      labels:
        app: static-website

    spec:
      containers:
        - name: nginx
          image: static-website:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
