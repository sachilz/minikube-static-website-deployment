<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Kubernetes Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
        }

        .card {
            text-align: center;
            padding: 45px 30px;
            margin: 20px;
            border: 1px solid #334155;
            border-radius: 18px;
            max-width: 550px;
            background: #1e293b;
        }

        h1 {
            color: #60a5fa;
        }

        p {
            color: #cbd5e1;
            line-height: 1.7;
        }

        .tag {
            display: inline-block;
            padding: 8px 14px;
            background: #164e63;
            border-radius: 20px;
            color: #a5f3fc;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <main class="card">
        <span class="tag">DevOps Learning Project</span>

        <h1>Hello, Kubernetes!</h1>

        <p>
            My first static website deployed on
            a local Kubernetes cluster using Minikube.
        </p>

        <p>
            Docker + Nginx + Kubernetes
        </p>
    </main>
</body>

</html>
